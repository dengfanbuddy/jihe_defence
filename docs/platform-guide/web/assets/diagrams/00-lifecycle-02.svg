"0.93"/><text x="246.2" y="114.0" font-size="12.5" fill="#333c45" text-anchor="middle">3. 回调（err/data）</text><line x1="139.4" y1="152.0" x2="499.3" y2="152.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa2589z)"/><rect x="152.0" y="131.0" width="334.8" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="319.3" y="144.0" font-size="12.5" fill="#333c45" text-anchor="middle">4. TbRoot.ins.loadTbs() ← 第一次、真正加载 12 张表</text><path d="M499.3,186.0 C535.3,178.0 535.3,202.0 499.3,200.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa2589z)"/><text x="543.3" y="188.0" font-size="12.5" fill="#333c45">5. 实例化容器 → 并行加载 JSON → handleData →</text><text x="543.3" y="203.0" font-size="12.5" fill="#333c45">afterHandle → afterAllHandle</text><line x1="139.4" y1="227.0" x2="637.9" y2="227.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa2589z)"/><rect x="307.1" y="206.0" width="163.0" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="388.6" y="219.0" font-size="12.5" fill="#333c45" text-anchor="middle">6. DataCenter.ins.init()</text><line x1="139.4" y1="257.0" x2="776.5" y2="257.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa2589z)"/><rect x="286.8" y="236.0" width="342.3" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="457.9" y="249.0" font-size="12.5" fill="#333c45" text-anchor="middle">7. scheduleOnce(0.5s) → director.loadScene('Main')</text><line x1="776.5" y1="287.0" x2="974.4" y2="287.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa2589z)"/><rect x="706.8" y="251.0" width="337.3" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="875.4" y="264.0" font-size="12.5" fill="#333c45" text-anchor="middle">8. 卸载 Loading.scene → 激活 Main.scene（三阶段批</text><text x="875.4" y="279.0" font-size="12.5" fill="#333c45" text-anchor="middle">量激活）</text><path d="M974.4,336.0 C1010.4,328.0 1010.4,352.0 974.4,350.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa2589z)"/><text x=