e" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fyskvnz)"/></g><g class="nodes"><rect x="31.3" y="22.0" width="277.8" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="44.3" y="44.1" font-size="13" fill="#2b3138">ezgame.setLogLevel(n)   ezgame.ts:33</text></g><rect x="76.1" y="103.0" width="188.1" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="101.7" y="125.1" font-size="13" fill="#2b3138">n &gt; logLevel.Error ?</text><text x="89.1" y="142.1" font-size="13" fill="#2b3138">(Error = 4, LogMgr.ts:7)</text></g><rect x="82.4" y="201.0" width="175.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="95.4" y="223.1" font-size="13" fill="#2b3138">n = logLevel.Error = 4</text><text x="115.2" y="240.1" font-size="13" fill="#2b3138">ezgame.ts:34-36</text></g><rect x="77.6" y="299.0" width="185.2" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="101.7" y="321.1" font-size="13" fill="#2b3138">n &lt; logLevel.Debug ?</text><text x="90.6" y="338.1" font-size="13" fill="#2b3138">(Debug = 1, LogMgr.ts:4)</text></g><rect x="22.0" y="397.0" width="172.6" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.0" y="419.1" font-size="13" fill="#2b3138">n = logLevel.Debug = 1</text><text x="53.3" y="436.1" font-size="13" fill="#2b3138">ezgame.ts:37-39</text></g><rect x="224.6" y="405.5" width="93.7" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="237.6" y="427.6" font-size="13" fill="#2b3138">n 保持不变</text></g><rect x="91.1" y="495.0" width="158.2" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="104.1" y="517.1" font-size="13" fill="#2b3138">LogMgr.logLevel = n</text><text x="126.7" y="534.1" font-size="13" fill="#2b3138">ezgame.ts:40</text></g><rect x="37.5" y="593.0" width="265.2" height="103.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="87.5" y="615.1" font-size="13" fill="#2b3138">取值语义：数字越小越啰嗦</text><text x="123.6" y="632.1" font-size="13" fill="#2b3138">1 = debug 全开</text><text x="88.1" y="649.1" font-size="13" fill="#2b3138">2 = 默认（LogMgr.ts:16）</text><text x="71.2" y="666.1" font-size="13" fill="#2b3138">4 = debug/info/warn 全静音，</text><text x="50.5" y="683.1" font-size="13" fill="#2b3138">但 err 仍会打印（LogMgr.ts:68-70）</text></g></g><g class="edge-labels"><g><rect x="152.2" y="169.0" width="35.8" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="170.1" y="182.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;是&quot;</text></g><g><rect x="152.2" y="218.0" width="35.8" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="170.1" y="231.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;否&quot;</text></g><g><rect x="121.3" y="365.0" width="35.8" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="139.2" y="378.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;是&quot;</text></g><g><rect x="202.9" y="369.3" width="35.8" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="220.8" y="382.3" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;否&quot;</text></g></g><g class="notes"></g></svg>