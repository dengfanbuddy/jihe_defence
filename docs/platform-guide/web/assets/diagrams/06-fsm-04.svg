" y="598.1" font-size="13" fill="#2b3138">（不是 'Combat'）</text></g></g><g class="edge-labels"><g><rect x="206.4" y="152.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="217.5" y="165.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="206.4" y="233.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="217.5" y="246.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="206.4" y="282.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="217.5" y="295.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g><g><rect x="346.9" y="152.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="358.0" y="165.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g></g><g class="notes"></g></svg>