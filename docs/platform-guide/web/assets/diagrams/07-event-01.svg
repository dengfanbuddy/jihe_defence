<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1156 454" width="1156" height="454" role="img" aria-label="diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-f3xwefz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs><g class="edges"><path d="M337.17969999999997,57 C337.17969999999997,84.25 293.63489999999996,84.25 293.63489999999996,111.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M293.63489999999996,146.5 C293.63489999999996,173.75 341.9338,173.75 341.9338,201" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M341.9338,253 C341.9338,280.25 138.35000000000002,280.25 138.35000000000002,307.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M341.9338,253 C341.9338,280.25 625.1660000000002,280.25 625.1660000000002,307.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M566.3254,57 C566.3254,84.25 599.1218,84.25 599.1218,111.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M599.1218,146.5 C599.1218,178 624.4081000000001,178 624.4081000000001,209.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M624.4081000000001,244.5 C624.4081000000001,276 395.7447000000001,276 395.7447000000001,307.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M395.7447000000001,342.5 C395.7447000000001,369.75 445.99940000000004,369.75 445.99940000000004,397" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M395.7447000000001,342.5 C395.7447000000001,369.75 702.3606,369.75 702.3606,397" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M807.0463000000001,57 C807.0463000000001,80 883.3875000000002,80 883.3875000000002,103" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M883.3875000000002,155 C883.3875000000002,182.25 860.3749000000001,182.25 860.3749000000001,209.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M860.3749000000001,244.5 C860.3749000000001,276 790.9926000000002,276 790.9926000000002,307.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/><path d="M860.3749000000001,244.5 C860.3749000000001,271.75 1001.1219000000001,271.75 1001.1219000000001,299" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-f3xwefz)"/></g><g class="nodes"><rect x="212.8" y="22.0" width="248.8" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="225.8" y="44.1" font-size="13" fill="#2b3138">addNotice(type, caller, listener)</text></g><rect x="149.9" y="111.5" width="287.4" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="162.9" y="133.6" font-size="13" fill="#2b3138">EventTarget.on(type, listener, caller)</text></g><rect x="227.9" y="201.0" width="228.0" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="307.9" y="223.1" font-size="13" fill="#2b3138">同 type 下</text><text x="240.9" y="240.1" font-size="13" fill="#2b3138">已有相同的 (listener, caller) ?</text></g><rect x="22.0" y="307.5" width="232.7" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.0" y="329.6" font-size="13" fill="#2b3138">忽略（引擎去重，不会重复触发）</text></g><rect x="536.8" y="307.5" width="176.8" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="549.8" y="329.6" font-size="13" fill="#2b3138">登记到该 type 的监听表</text></g><rect x="491.6" y="22.0" width="149.5" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="504.6" y="44.1" font-size="13" fill="#2b3138">emit(type, ...args)</text></g><rect x="467.3" y="111.5" width="263.6" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="480.3" y="133.6" font-size="13" fill="#2b3138">EventTarget.emit → 同步遍历监听表</text></g><rect x="485.9" y="209.5" width="276.9" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="498.9" y="231.6" font-size="13" fill="#2b3138">逐个执行 listener.call(caller, ...args)</text></g><rect x="284.7" y="307.5" width="222.1" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="297.7" y="329.6" font-size="13" fill="#2b3138">回调内部又 emit 同一个 type ?</text></g><rect x="336.5" y="397.0" width="218.9" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="349.5" y="419.1" font-size="13" fill="#2b3138">立即重入派发（可能无限递归）</text></g><rect x="585.5" y="397.0" width="233.8" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="598.5" y="419.1" font-size="13" fill="#2b3138">返回 void（拿不到'有没有人接'）</text></g><rect x="671.1" y="22.0" width="272.0" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="684.1" y="44.1" font-size="13" fill="#2b3138">removeNotice(type, caller, listener)</text></g><rect x="760.9" y="103.0" width="245.0" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="773.9" y="125.1" font-size="13" fill="#2b3138">EventTarget.off(type, listener,</text><text x="860.7" y="142.1" font-size="13" fill="#2b3138">caller)</text></g><rect x="792.9" y="209.5" width="135.0" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="805.9" y="231.6" font-size="13" fill="#2b3138">三元组完全匹配 ?</text></g><rect x="743.5" y="307.5" width="94.9" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="756.5" y="329.6" font-size="13" fill="#2b3138">摘除该监听</text></g><rect x="868.4" y="299.0" width="265.4" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="881.4" y="321.1" font-size="13" fill="#2b3138">静默不生效（靶点：caller 传了 null /</text><text x="939.1" y="338.1" font-size="13" fill="#2b3138">传了新的函数引用）</text></g></g><g class="edge-labels"><g><rect x="229.0" y="271.3" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="240.1" y="284.3" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="472.5" y="271.3" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="483.5" y="284.3" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g><g><rect x="409.8" y="360.8" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="420.9" y="373.8" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="538.0" y="360.8" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="549.1" y="373.8" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g><g><rect x="814.6" y="267.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="825.7" y="280.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="919.7" y="262.8" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="930.7" y="275.8" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g></g><g class="notes"></g></svg>