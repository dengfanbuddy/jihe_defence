<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 564 346" width="564" height="346" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-ssgbzxe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><line x1="72.0" y1="46" x2="72.0" y2="332" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="214.0" y1="46" x2="214.0" y2="332" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="423.9" y1="46" x2="423.9" y2="332" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="72.0" y1="62.0" x2="214.0" y2="62.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-ssgbzxe)"/><rect x="107.4" y="41.0" width="71.2" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="143.0" y="54.0" font-size="12.5" fill="#333c45" text-anchor="middle">stopBGM()</text><line x1="214.0" y1="92.0" x2="423.9" y2="92.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-ssgbzxe)"/><rect x="255.5" y="71.0" width="126.9" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="318.9" y="84.0" font-size="12.5" fill="#333c45" text-anchor="middle">bgm.stop() :98-102</text><g><rect x="170.0" y="122.0" width="298.0" height="34.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M184.0,122.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="184.0" y="150.0" font-size="12" fill="#5c5433">全文无 tween / schedule → 没有淡出，是硬停</text></g><line x1="72.0" y1="174.0" x2="214.0" y2="174.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-ssgbzxe)"/><rect x="47.6" y="153.0" width="190.7" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="143.0" y="166.0" font-size="12.5" fill="#333c45" text-anchor="middle">pauseBGM() 或 直接 playBGM()</text><g><rect x="6.0" y="204.0" width="341.2" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M20.0,204.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="20.0" y="232.0" font-size="12" fill="#5c5433">「换曲」缺一步：没有 playBGM(url)、没有 setClip，</text><text x="20.0" y="248.0" font-size="12" fill="#5c5433">bgm 是 private 字段 :57，类内也没有任何 clip 赋值点</text></g><line x1="214.0" y1="272.0" x2="423.9" y2="272.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-ssgbzxe)"/><rect x="260.6" y="251.0" width="116.7" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="318.9" y="264.0" font-size="12.5" fill="#333c45" text-anchor="middle">bgm.play() :91-95</text><line x1="423.9" y1="302.0" x2="72.0" y2="302.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-ssgbzxe)" stroke-dasharray="5 4"/><rect x="110.2" y="281.0" width="275.5" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="247.9" y="294.0" font-size="12.5" fill="#333c45" text-anchor="middle">有 clip 才出声；无 clip 时静默（工程现状）</text><g><rect x="26.0" y="16" width="92.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="72.0" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">游戏代码</text></g><g><rect x="158.0" y="16" width="111.9" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="214.0" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">AudioMgr.ins</text></g><g><rect x="309.9" y="16" width="227.9" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="423.9" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">bgm AudioSource（loop=true :</text><text x="423.9" y="52.0" font-size="13" fill="#26405a" text-anchor="middle">19）</text></g></svg>