<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 373" width="152" height="373" role="img" aria-label="diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-funuisq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs><g class="edges"><path d="M75.9955,42 C75.9955,65 75.9955,65 75.9955,88" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M75.9955,123 C75.9955,146 75.9955,146 75.9955,169" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M115.9955,179.5 C141.9955,153.5 141.9955,205.5 115.9955,191.4" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M75.9955,169 C75.9955,146 75.9955,146 75.9955,123" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M75.9955,204 C75.9955,227 75.9955,227 75.9955,250" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M75.9955,250 C75.9955,186.5 75.9955,186.5 75.9955,123" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M75.9955,123 C75.9955,146 75.9955,146 75.9955,169" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M75.9955,123 C75.9955,227 75.9955,227 75.9955,331" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/><path d="M75.9955,285 C75.9955,308 75.9955,308 75.9955,331" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-funuisq)"/></g><g class="nodes"><circle cx="75.9955" cy="32" r="10" fill="#39424d"/><rect x="36.0" y="88.0" width="80.0" height="35.0" rx="15" fill="#edf3fa" stroke="#7d9fc4" stroke-width="1.3"/><g><text x="59.6" y="110.1" font-size="13" fill="#2b3138">Built</text></g><rect x="36.0" y="169.0" width="80.0" height="35.0" rx="15" fill="#edf3fa" stroke="#7d9fc4" stroke-width="1.3"/><g><text x="50.4" y="191.1" font-size="13" fill="#2b3138">Running</text></g><rect x="22.0" y="250.0" width="108.0" height="35.0" rx="15" fill="#edf3fa" stroke="#7d9fc4" stroke-width="1.3"/><g><text x="35.0" y="272.1" font-size="13" fill="#2b3138">Interrupted</text></g><circle cx="75.9955" cy="341" r="10" fill="#39424d"/></g><g class="edge-labels"><g><rect x="0.9" y="42.0" width="150.2" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="69.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">new BehaviorTree(root,</text><text x="76.0" y="82.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">bb)（节点实例同时被 new</text><text x="76.0" y="95.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">出来）</text></g><g><rect x="6.6" y="123.0" width="138.7" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="150.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">第一次 update()</text><text x="76.0" y="163.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">（isRunning 置 true，</text><text x="76.0" y="176.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">root.tick）</text></g><g><rect x="148.0" y="156.5" width="124.7" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="153.0" y="183.5" font-size="11.5" fill="#4a5560" text-anchor="start" font-family="ui-monospace,Consolas,monospace">根返回 RUNNING ——</text><text x="153.0" y="196.5" font-size="11.5" fill="#4a5560" text-anchor="start" font-family="ui-monospace,Consolas,monospace">不做任何 reset，</text><text x="153.0" y="209.5" font-size="11.5" fill="#4a5560" text-anchor="start" font-family="ui-monospace,Consolas,monospace">内部进度保留</text></g><g><rect x="7.2" y="116.0" width="137.6" height="60" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="150.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">根返回 SUCCESS /</text><text x="76.0" y="163.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">FAILURE —— update()</text><text x="76.0" y="176.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">内部立刻 reset()，</text><text x="76.0" y="189.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">状态写回 FAILURE</text></g><g><rect x="11.4" y="204.0" width="129.1" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="231.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">interrupt(type)（仅</text><text x="76.0" y="244.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">isRunning 为 true</text><text x="76.0" y="257.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">时生效）</text></g><g><rect x="5.6" y="149.5" width="140.8" height="74" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="190.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">下一帧 tick 时节点自我</text><text x="76.0" y="203.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">reset（Sequence/</text><text x="76.0" y="216.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">Selector/Repeater/</text><text x="76.0" y="229.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">Wait 的入口）或显式</text><text x="76.0" y="242.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">tree.reset()</text></g><g><rect x="4.0" y="123.0" width="144.1" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="150.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">再次 update()</text><text x="76.0" y="163.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">即从根重跑（无需重建对</text><text x="76.0" y="176.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">象图）</text></g><g><rect x="5.8" y="204.0" width="140.4" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="231.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">无 dispose API、</text><text x="76.0" y="244.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">不注册任务、不持有 cc</text><text x="76.0" y="257.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">资源 —— 丢掉引用即可</text></g><g><rect x="58.8" y="299.0" width="34.4" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="76.0" y="312.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">同上</text></g></g><g class="notes"></g></svg>