<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 474" width="942" height="474" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-s5nsm34" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><line x1="73.3" y1="46" x2="73.3" y2="460" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="272.5" y1="46" x2="272.5" y2="460" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="536.6" y1="46" x2="536.6" y2="460" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="802.4" y1="46" x2="802.4" y2="460" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="272.5" y1="62.0" x2="536.6" y2="62.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)"/><rect x="236.9" y="26.0" width="335.3" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="404.5" y="39.0" font-size="12.5" fill="#333c45" text-anchor="middle">1. 阶段2 onLoad（父先于子）→ 建功能类 + provide 5</text><text x="404.5" y="54.0" font-size="12.5" fill="#333c45" text-anchor="middle">个门面 + scope.on 事件 + scope.watch</text><line x1="272.5" y1="107.0" x2="802.4" y2="107.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)"/><rect x="376.8" y="71.0" width="321.4" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="537.4" y="84.0" font-size="12.5" fill="#333c45" text-anchor="middle">2. 阶段2 onLoad → UIWidget.onLoad：建 scope →</text><text x="537.4" y="99.0" font-size="12.5" fill="#333c45" text-anchor="middle">onInit()（此刻 inject 得到父刚 provide 的门面）</text><line x1="272.5" y1="152.0" x2="536.6" y2="152.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)"/><rect x="343.6" y="131.0" width="121.8" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="404.5" y="144.0" font-size="12.5" fill="#333c45" text-anchor="middle">3. 阶段3 onEnable</text><line x1="272.5" y1="182.0" x2="802.4" y2="182.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)"/><rect x="379.3" y="161.0" width="316.2" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="537.4" y="174.0" font-size="12.5" fill="#333c45" text-anchor="middle">4. 阶段3 onEnable → scope.resume() → onShow()</text><path d="M73.3,216.0 C109.3,208.0 109.3,232.0 73.3,230.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)"/><text x="117.3" y="218.0" font-size="12.5" fill="#333c45">5. getComponent(Widget)?.updateAlignment()</text><text x="117.3" y="233.0" font-size="12.5" fill="#333c45">（UIManager.ts:207-210）</text><line x1="73.3" y1="257.0" x2="536.6" y2="257.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)"/><rect x="201.6" y="236.0" width="206.6" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="304.9" y="249.0" font-size="12.5" fill="#333c45" text-anchor="middle">6. await view.showView(...args)</text><path d="M536.6,291.0 C572.6,283.0 572.6,307.0 536.6,305.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)"/><text x="580.6" y="293.0" font-size="12.5" fill="#333c45">7. 首次 → init()；node.active = true（已是 true，</text><text x="580.6" y="308.0" font-size="12.5" fill="#333c45">无操作）→ scope.resume() → show()</text><line x1="536.6" y1="332.0" x2="73.3" y2="332.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s5nsm34)" stroke-dasharray="5 4"/><rect x="147.3" y="281.0" width="315.3" height="47" rx="3" fill="#ffffff" opacity="0.93"/><text x="304.9" y="294.0" font-size="12.5" fill="#333c45" text-anchor="middle">8. resolve → LogMgr.debug('显示视图…') →</text><text x="304.9" y="309.0" font-size="12.5" fill="#333c45" text-anchor="middle">afterShowCb?.() →（Scene 层）scheduleOnce 1s</text><text x="304.9" y="324.0" font-size="12.5" fill="#333c45" text-anchor="middle">后发 SCENE_LOAD_PROGRESS=1.0</text><g><rect x="364.9" y="392.0" width="345.0" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M378.9,392.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="378.9" y="420.0" font-size="12" fill="#5c5433">之后：下一个 tick 的 start 阶段跑 start()［推断，见</text><text x="378.9" y="436.0" font-size="12" fill="#5c5433">§6.3］，再往后每帧 update()</text></g><g><rect x="26.0" y="16" width="94.6" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="73.3" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">UIManager</text></g><g><rect x="160.6" y="16" width="224.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="272.5" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">Cocos 激活（NodeActivator）</text></g><g><rect x="424.5" y="16" width="224.1" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="536.6" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">Scene_Game_Stage（BaseView</text><text x="536.6" y="52.0" font-size="13" fill="#26405a" text-anchor="middle">）</text></g><g><rect x="688.6" y="16" width="227.5" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="802.4" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">子树 UIWidget（View_Game_Sta</text><text x="802.4" y="52.0" font-size="13" fill="#26405a" text-anchor="middle">ge / 面板 / item）</text></g></svg>