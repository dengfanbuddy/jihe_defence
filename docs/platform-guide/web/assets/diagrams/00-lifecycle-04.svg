72" y="227.5" font-size="12" fill="#5c5433">· scope.on(...) 接线面板事件</text><text x="272" y="243.5" font-size="12" fill="#5c5433">· scope.watch(relicShop.panelVisible)</text></g><path d="M157.6,186.5 L258,186.5" stroke="#d9c98a" stroke-dasharray="4 3" fill="none"/><g><rect x="647.9136000000001" y="176.5" width="333.3" height="182.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M661.9136000000001,176.5 l16,0 l-16,16 z" fill="#e8dcae"/><text x="661.9136000000001" y="204.5" font-size="12" fill="#5c5433">show() 每次都跑：</text><text x="661.9136000000001" y="220.5" font-size="12" fill="#5c5433">· resetRun() 清上一局</text><text x="661.9136000000001" y="236.5" font-size="12" fill="#5c5433">· snapshotAchieveEffects() 开局快照</text><text x="661.9136000000001" y="252.5" font-size="12" fill="#5c5433">· config = defaultConfig</text><text x="661.9136000000001" y="268.5" font-size="12" fill="#5c5433">· BattleConstUtil.markLoaded()</text><text x="661.9136000000001" y="284.5" font-size="12" fill="#5c5433">· EventBus.on(BATTLE_EXIT)</text><text x="661.9136000000001" y="300.5" font-size="12" fill="#5c5433">· initBattle()（:769）重建本局 ctx / 池 / 打击反馈</text><text x="661.9136000000001" y="316.5" font-size="12" fill="#5c5433">· heroSelect.startRun() → 开选英雄面板</text><text x="661.9136000000001" y="332.5" font-size="12" fill="#5c5433">· battleStore.phase / phaseRemainTime 初值</text><text x="661.9136000000001" y="348.5" font-size="12" fill="#5c5433">· 绑定遗物入口按钮（先 off 再 on）</text></g><path d="M164.4,267.5 L647.9136000000001,267.5" stroke="#d9c98a" stroke-dasharray="4 3" fill="none"/></g></svg>