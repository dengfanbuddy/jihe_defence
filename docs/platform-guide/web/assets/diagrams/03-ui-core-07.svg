 font-size="13" fill="#2b3138">加载中</text></g><rect x="22.0" y="250.0" width="80.0" height="35.0" rx="15" fill="#edf3fa" stroke="#7d9fc4" stroke-width="1.3"/><g><text x="41.3" y="272.1" font-size="13" fill="#2b3138">已打开</text></g><rect x="22.0" y="331.0" width="80.0" height="35.0" rx="15" fill="#edf3fa" stroke="#7d9fc4" stroke-width="1.3"/><g><text x="41.3" y="353.1" font-size="13" fill="#2b3138">已关闭</text></g><rect x="22.0" y="412.0" width="80.0" height="35.0" rx="15" fill="#edf3fa" stroke="#7d9fc4" stroke-width="1.3"/><g><text x="41.3" y="434.1" font-size="13" fill="#2b3138">已销毁</text></g><circle cx="62" cy="503" r="10" fill="#39424d"/></g><g class="edge-labels"><g><rect x="-4.3" y="123.0" width="132.5" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="62.0" y="150.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">showUI() —— single/</text><text x="62.0" y="163.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">层节点/缓存</text><text x="62.0" y="176.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">三条复用路径都未命中</text></g><g><rect x="-4.3" y="130.0" width="132.6" height="32" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="62.0" y="150.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">prefab 加载失败 ——</text><text x="62.0" y="163.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">error + return null</text></g><g><rect x="-5.4" y="197.0" width="134.8" height="60" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="62.0" y="231.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">instantiate +</text><text x="62.0" y="244.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">setParent 层节点：</text><text x="62.0" y="257.0" font-si