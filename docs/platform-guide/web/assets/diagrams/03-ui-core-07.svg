howUI() 命中 takeFromCa</text><text x="62.0" y="325.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">che（60s 内）—— 跳过</text><text x="62.0" y="338.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">init()/onLoad</text></g><g><rect x="-13.5" y="359.0" width="151.0" height="60" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="62.0" y="393.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">cleanupExpiredCache 每</text><text x="62.0" y="406.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">10s 扫到过期，或被同</text><text x="62.0" y="419.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">key 新缓存挤掉 ——</text><text x="62.0" y="432.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">destroyCachedView()</text></g><g><rect x="-11.1" y="325.5" width="146.2" height="46" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="62.0" y="352.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">closeUI(view, destroy:</text><text x="62.0" y="365.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">true) —— deleteView()</text><text x="62.0" y="378.5" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">+ node.destroy()</text></g></g><g class="notes"></g></svg>