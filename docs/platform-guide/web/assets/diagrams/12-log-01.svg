" width="134.8" height="32" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="274.1" y="395.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;是（等级被设成 3</text><text x="274.1" y="408.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">Warning / 4 Error）&quot;</text></g><g><rect x="367.4" y="382.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="378.5" y="395.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g></g><g class="notes"></g></svg>