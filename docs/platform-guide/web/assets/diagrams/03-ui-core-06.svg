<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 567 512" width="567" height="512" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-smzlfl9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><line x1="72.0" y1="46" x2="72.0" y2="498" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="205.3" y1="46" x2="205.3" y2="498" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="338.6" y1="46" x2="338.6" y2="498" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="482.7" y1="46" x2="482.7" y2="498" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><g><rect x="6.0" y="62.0" width="352.4" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M20.0,62.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="20.0" y="90.0" font-size="12" fill="#5c5433">前置：上一次 closeUI 已执行 close() + scope.pause() +</text><text x="20.0" y="106.0" font-size="12" fill="#5c5433">node.active=false + addToCache()</text></g><line x1="72.0" y1="130.0" x2="205.3" y2="130.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-smzlfl9)"/><rect x="28.1" y="109.0" width="221.1" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="138.6" y="122.0" font-size="12.5" fill="#333c45" text-anchor="middle">1. showUI(同一个视图类)（60s 内）</text><path d="M205.3,164.0 C241.3,156.0 241.3,180.0 205.3,178.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-smzlfl9)"/><text x="249.3" y="166.0" font-size="12.5" fill="#333c45">2. single 查栈未命中；findViewOnLayer 跳过</text><text x="249.3" y="181.0" font-size="12.5" fill="#333c45">active=false 的缓存节点（UIManager.ts:</text><text x="249.3" y="196.0" font-size="12.5" fill="#333c45">462-464）；takeFromCache 命中</text><line x1="205.3" y1="220.0" x2="338.6" y2="220.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-smzlfl9)"/><rect x="116.5" y="169.0" width="310.9" height="47" rx="3" fill="#ffffff" opacity="0.93"/><text x="271.9" y="182.0" font-size="12.5" fill="#333c45" text-anchor="middle">3. stack.push + setParent(同一个层节点) →</text><text x="271.9" y="197.0" font-size="12.5" fill="#333c45" text-anchor="middle">引擎判到父未变直接 return，不重新激活［出处见</text><text x="271.9" y="212.0" font-size="12.5" fill="#333c45" text-anchor="middle">docs/UI框架使用说明.md §12］</text><line x1="205.3" y1="280.0" x2="338.6" y2="280.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-smzlfl9)"/><rect x="168.6" y="259.0" width="206.6" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="271.9" y="272.0" font-size="12.5" fill="#333c45" text-anchor="middle">4. await view.showView(...args)</text><path d="M338.6,314.0 C374.6,306.0 374.6,330.0 338.6,328.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-smzlfl9)"/><text x="382.6" y="316.0" font-size="12.5" fill="#333c45">5. _isInitialized 已是 true → 跳过 init()（BaseView.</text><text x="382.6" y="331.0" font-size="12.5" fill="#333c45">ts:72-75）</text><line x1="338.6" y1="355.0" x2="482.7" y2="355.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-smzlfl9)"/><rect x="265.4" y="319.0" width="290.5" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="410.6" y="332.0" font-size="12.5" fill="#333c45" text-anchor="middle">6. node.active = true → 子节点 onEnable →</text><text x="410.6" y="347.0" font-size="12.5" fill="#333c45" text-anchor="middle">scope.resume()（补播）+ onShow()</text><path d="M338.6,404.0 C374.6,396.0 374.6,420.0 338.6,418.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-smzlfl9)"/><text x="382.6" y="406.0" font-size="12.5" fill="#333c45">7. scope.resume()（补播）→ show()</text><g><rect x="210.8" y="430.0" width="350.1" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M224.8,430.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="224.8" y="458.0" font-size="12" fill="#5c5433">不会再跑：__preload / onLoad / init() / onInit() ——</text><text x="224.8" y="474.0" font-size="12" fill="#5c5433">一辈子只有一次</text></g><g><rect x="26.0" y="16" width="92.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="72.0" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">调用方</text></g><g><rect x="158.0" y="16" width="94.6" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="205.3" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">UIManager</text></g><g><rect x="292.6" y="16" width="92.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="338.6" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">BaseView</text></g><g><rect x="424.6" y="16" width="116.3" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="482.7" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">UIWidget 子树</text></g></svg>