<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573 528" width="573" height="528" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-s41c5ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><rect x="190.2" y="160.0" width="370.5" height="152.0" rx="7" fill="rgba(238,243,249,0.45)" stroke="#b9c6d4" stroke-width="1.2"/><line x1="95.1" y1="46" x2="95.1" y2="514" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="260.0" y1="46" x2="260.0" y2="514" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="451.3" y1="46" x2="451.3" y2="514" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="95.1" y1="62.0" x2="260.0" y2="62.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s41c5ep)"/><rect x="16.7" y="41.0" width="321.6" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="177.6" y="54.0" font-size="12.5" fill="#333c45" text-anchor="middle">TimeMgr.ins.addSecHandler(id, this.onTick, this)</text><g><rect x="6.0" y="92.0" width="378.0" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M20.0,92.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="20.0" y="120.0" font-size="12" fill="#5c5433">若 TimeMgr.ins 为 null（组件未挂/未 onLoad），这一行会抛</text><text x="20.0" y="136.0" font-size="12" fill="#5c5433">TypeError</text></g><line x1="260.0" y1="194.0" x2="451.3" y2="194.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s41c5ep)"/><rect x="279.1" y="173.0" width="153.0" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="355.6" y="186.0" font-size="12.5" fill="#333c45" text-anchor="middle">func.call(obj)，无参数</text><line x1="451.3" y1="224.0" x2="260.0" y2="224.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s41c5ep)" stroke-dasharray="5 4"/><rect x="310.9" y="203.0" width="89.5" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="355.6" y="216.0" font-size="12.5" fill="#333c45" text-anchor="middle">返回值被丢弃</text><g><rect x="274.8" y="254.0" width="292.0" height="34.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M288.8,254.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="288.8" y="282.0" font-size="12" fill="#5c5433">抛错 → 只 console.error，不影响其他处理器</text></g><line x1="274.8" y1="267.0" x2="451.3" y2="267.0" stroke="#d9c98a" stroke-dasharray="4 3"/><line x1="95.1" y1="324.0" x2="260.0" y2="324.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s41c5ep)"/><rect x="18.3" y="288.0" width="318.5" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="177.6" y="301.0" font-size="12.5" fill="#333c45" text-anchor="middle">onDestroy/onDisable 之前 removeSecHandler(id,</text><text x="177.6" y="316.0" font-size="12.5" fill="#333c45" text-anchor="middle">this.onTick, this)</text><g><rect x="73.4" y="369.0" width="373.1" height="82.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M87.4,369.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="87.4" y="397.0" font-size="12" fill="#5c5433">忘了移除会怎样：</text><text x="87.4" y="413.0" font-size="12" fill="#5c5433">1) obj 已销毁也在被调用（裸 call，不校验有效性）；</text><text x="87.4" y="429.0" font-size="12" fill="#5c5433">2) list 与 Map key 永久留在 secondHandlers 里；</text><text x="87.4" y="445.0" font-size="12" fill="#5c5433">3) 只有 TimeMgr 自己销毁时才由引擎清空它的全部 Schedule</text></g><line x1="73.4" y1="382.0" x2="260.0" y2="382.0" stroke="#d9c98a" stroke-dasharray="4 3"/><path d="M260.0,473.0 C296.0,465.0 296.0,489.0 260.0,487.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-s41c5ep)"/><text x="304.0" y="475.0" font-size="12.5" fill="#333c45">组件/节点销毁 → Component._onPreDestroy →</text><text x="304.0" y="490.0" font-size="12.5" fill="#333c45">unscheduleAllCallbacks()</text><g><rect x="26.0" y="16" width="138.2" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="95.1" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">业务组件（宿主）</text></g><g><rect x="204.2" y="16" width="111.5" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="260.0" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">TimeMgr 组件</text></g><g><rect x="355.7" y="16" width="191.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="451.3" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">已注册的处理器 func+obj</text></g><g><path d="M190.2,180.0 h93.8 v-20 h-93.8 z" fill="#eef3f9" stroke="#b9c6d4" stroke-width="1.2"/><text x="198.2" y="174.5" font-size="11.5" fill="#41576e" font-family="ui-monospace,Consolas,monospace">loop 每秒一次</text></g></svg>