 fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fc4a793)"/><path d="M445.28380000000004,223 C445.28380000000004,246 674.7051000000001,246 674.7051000000001,269" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fc4a793)"/><path d="M445.28380000000004,223 C445.28380000000004,250.25 447.83310000000006,250.25 447.83310000000006,277.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fc4a793)"/><path d="M447.83310000000006,312.5 C447.83310000000006,339.75 445.28380000000004,339.75 445.28380000000004,367" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fc4a793)"/><path d="M729.6873000000002,108 C729.6873000000002,312 605.5029000000001,312 605.5029000000001,516" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fc4a793)"/></g><g class="nodes"><rect x="22.0" y="22.0" width="289.5" height="120.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="46.0" y="44.1" font-size="13" fill="#2b3138">onInit（Tabs.ts:231）：provide 两个</text><text x="56.4" y="61.1" font-size="13" fill="#2b3138">ref（:234-235，父 onLoad 早于子</text><text x="136.7" y="78.1" font-size="13" fill="#2b3138">onLoad）</text><text x="35.0" y="95.1" font-size="13" fill="#2b3138">→ collectNodes（:370）→ bindTabClick</text><text x="35.6" y="112.1" font-size="13" fill="#2b3138">s（:409）→ switchOnInit ? select(defa</text><text x="44.2" y="129.1" font-size="13" fill="#2b3138">ultIndex)（:243）: refresh()（:245）</text></g><rect x="303.4" y="367.0" width="283.8" height="103.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="318.2" y="389.1" font-size="13" fill="#2b3138">select(index, options?)（:273）：越界</text><text x="316.4" y="406.1" font-size="13" fill="#2b3138">→ warn + false（:275-278）；同值且无</text><text x="354.7" y="423.1" font-size="13" fill="#2b3138">force → false（:279-281）</text><text x="325.5" y="440.1" font-size="13" fill="#2b3138">→ 状态先落盘 _selectedIndex + 两个</text><text x="390.5" y="457.1" font-size="13" fill="#2b3138">ref（:284-293）</text></g><rect x="152.2" y="524.5" width="290.4" height="103.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="168.3" y="546.6" font-size="13" fill="#2b3138">applyTabStates（:453）→ applyTabSel</text><text x="165.2" y="563.6" font-size="13" fill="#2b3138">ected（:360）→ TabItem.setSelected（</text><text x="244.8" y="580.6" font-size="13" fill="#2b3138">TabItem.ts:82）</text><text x="179.0" y="597.6" font-size="13" fill="#2b3138">→ onSelectedChanged（TabItem.ts:</text><text x="241.5" y="614.6" font-size="13" fill="#2b3138">98，基类空实现）</text></g><rect x="472.7" y="516.0" width="265.6" height="120.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="489.1" y="538.1" font-size="13" fill="#2b3138">applyContentStates（:463）：只把</text><text x="492.9" y="555.1" font-size="13" fill="#2b3138">contentNodes[i].active 写成 i ===</text><text x="576.1" y="572.1" font-size="13" fill="#2b3138">selected</text><text x="485.7" y="589.1" font-size="13" fill="#2b3138">显示项 active=true → onTabShow（:</text><text x="500.5" y="606.1" font-size="13" fill="#2b3138">471-475）｜隐藏项 onTabHide →</text><text x="518.9" y="623.1" font-size="13" fill="#2b3138">active=false（:478-479）</text></g><rect x="316.3" y="682.0" width="258.1" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="329.3" y="704.1" font-size="13" fill="#2b3138">onTabChanged（:337）+ scope.emit</text><text x="335.4" y="721.1" font-size="13" fill="#2b3138">Changed（:300）（options.silent</text><text x="403.9" y="738.1" font-size="13" fill="#2b3138">时整段跳过）</text></g><rect x="308.8" y="797.0" width="272.9" height="103.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="328.8" y="819.1" font-size="13" fill="#2b3138">onShow（:249）：resetOnShow 才回</text><text x="321.8" y="836.1" font-size="13" fill="#2b3138">defaultIndex，之后无条件 refresh（:</text><text x="426.8" y="853.1" font-size="13" fill="#2b3138">254）</text><text x="332.6" y="870.1" font-size="13" fill="#2b3138">缓存复用不会重跑 onInit（:250-251</text><text x="424.6" y="887.1" font-size="13" fill="#2b3138">注释）</text></g><rect x="301.5" y="946.0" width="287.5" height="86.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="314.5" y="968.1" font-size="13" fill="#2b3138">onDispose（:257）：unbindTabClicks（:</text><text x="378.4" y="985.1" font-size="13" fill="#2b3138">423，逐个成对 off）</text><text x="340.8" y="1002.1" font-size="13" fill="#2b3138">+ 清空 _tabList/_contentList/</text><text x="357.2" y="1019.1" font-size="13" fill="#2b3138">_tabItems/_keys/两个 ref</text></g><rect x="341.5" y="64.5" width="219.3" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="354.5" y="86.6" font-size="13" fill="#2b3138">点击 → onTabClicked（:433）</text></g><rect x="337.6" y="188.0" width="215.3" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="350.6" y="210.1" font-size="13" fill="#2b3138">index === _selectedIndex ？</text></g><rect x="104.1" y="269.0" width="228.6" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="117.1" y="291.1" font-size="13" fill="#2b3138">select(-1)（:439）：全部取消 +</text><text x="161.4" y="308.1" font-size="13" fill="#2b3138">隐藏所有 content</text></g><rect x="563.0" y="269.0" width="223.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="578.0" y="291.1" font-size="13" fill="#2b3138">onTabReselect（:443）+ emit</text><text x="576.0" y="308.1" font-size="13" fill="#2b3138">Reselect（:444），不重设 ref</text></g><rect x="362.7" y="277.5" width="170.3" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="375.7" y="299.6" font-size="13" fill="#2b3138">select(index)（:447）</text></g><rect x="590.8" y="56.0" width="277.8" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="603.8" y="78.1" font-size="13" fill="#2b3138">content 节点是预制件里预摆的子节点：</text><text x="611.9" y="95.1" font-size="13" fill="#2b3138">Tabs 只切 active，不实例化、不销毁</text></g></g><g class="edge-labels"><g><rect x="255.5" y="230.0" width="152.7" height="32" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="331.8" y="250.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;是 + allowSwitchOff=tr</text><text x="331.8" y="263.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">ue&quot;</text></g><g><rect x="522.2" y="237.0" width="75.6" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="560.0" y="250.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;是 + 否则&quot;</text></g><g><rect x="428.6" y="241.3" width="35.8" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="446.6" y="254.3" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;否&quot;</text></g></g><g class="notes"></g></svg>