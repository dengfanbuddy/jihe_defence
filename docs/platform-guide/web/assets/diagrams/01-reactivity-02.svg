<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 655 593" width="655" height="593" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-sxrogsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><line x1="109.3" y1="46" x2="109.3" y2="579" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="344.1" y1="46" x2="344.1" y2="579" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="562.0" y1="46" x2="562.0" y2="579" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="109.3" y1="62.0" x2="344.1" y2="62.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><rect x="86.5" y="26.0" width="280.4" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="226.7" y="39.0" font-size="12.5" fill="#333c45" text-anchor="middle">onLoad → scope.watch(src, cb) → run(fn)</text><text x="226.7" y="54.0" font-size="12.5" fill="#333c45" text-anchor="middle">（UIScope.ts:171）</text><path d="M344.1,111.0 C380.1,103.0 380.1,127.0 344.1,125.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><text x="388.1" y="113.0" font-size="12.5" fill="#333c45">activeEffectScope = this（effectScope.ts:96）</text><line x1="344.1" y1="137.0" x2="562.0" y2="137.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><rect x="322.7" y="101.0" width="260.7" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="453.0" y="114.0" font-size="12.5" fill="#333c45" text-anchor="middle">watch() 内 new ReactiveEffect(getter)</text><text x="453.0" y="129.0" font-size="12.5" fill="#333c45" text-anchor="middle">（watch.ts:281）</text><line x1="562.0" y1="182.0" x2="344.1" y2="182.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><rect x="322.8" y="146.0" width="260.4" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="453.0" y="159.0" font-size="12.5" fill="#333c45" text-anchor="middle">activeEffectScope.effects.push(this)</text><text x="453.0" y="174.0" font-size="12.5" fill="#333c45" text-anchor="middle">（effect.ts:116-120）</text><path d="M562.0,231.0 C598.0,223.0 598.0,247.0 562.0,245.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><text x="606.0" y="233.0" font-size="12.5" fill="#333c45">effect.run() 首次只建依赖、不回调（watch.ts:</text><text x="606.0" y="248.0" font-size="12.5" fill="#333c45">304-309）</text><g><rect x="192.2" y="272.0" width="287.0" height="34.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M206.2,272.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="206.2" y="300.0" font-size="12" fill="#5c5433">此后任意赋值走 §5.1 的写路径，全程同步回调</text></g><line x1="109.3" y1="324.0" x2="344.1" y2="324.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><rect x="73.9" y="288.0" width="305.5" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="226.7" y="301.0" font-size="12.5" fill="#333c45" text-anchor="middle">onDisable → pause() → effects[i].pause()：</text><text x="226.7" y="316.0" font-size="12.5" fill="#333c45" text-anchor="middle">PAUSED（UIWidget.ts:53 / effect.ts:122-124）</text><line x1="109.3" y1="369.0" x2="344.1" y2="369.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><rect x="72.9" y="318.0" width="307.6" height="47" rx="3" fill="#ffffff" opacity="0.93"/><text x="226.7" y="331.0" font-size="12.5" fill="#333c45" text-anchor="middle">onEnable → resume()：在 pausedQueueEffects</text><text x="226.7" y="346.0" font-size="12.5" fill="#333c45" text-anchor="middle">里就补播一次（UIWidget.ts:47 / effect.ts:</text><text x="226.7" y="361.0" font-size="12.5" fill="#333c45" text-anchor="middle">126-134）</text><line x1="109.3" y1="429.0" x2="344.1" y2="429.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><rect x="70.2" y="378.0" width="312.9" height="47" rx="3" fill="#ffffff" opacity="0.93"/><text x="226.7" y="391.0" font-size="12.5" fill="#333c45" text-anchor="middle">onDestroy → onDispose() → super.onDestroy()</text><text x="226.7" y="406.0" font-size="12.5" fill="#333c45" text-anchor="middle">→ dispose() → stop()（UIWidget.ts:56-68 /</text><text x="226.7" y="421.0" font-size="12.5" fill="#333c45" text-anchor="middle">UIScope.ts:247）</text><line x1="344.1" y1="489.0" x2="562.0" y2="489.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><rect x="301.8" y="453.0" width="302.6" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="453.0" y="466.0" font-size="12.5" fill="#333c45" text-anchor="middle">effects[i].stop() → removeSub() 摘掉全部 dep</text><text x="453.0" y="481.0" font-size="12.5" fill="#333c45" text-anchor="middle">订阅（effect.ts:178-188）</text><path d="M344.1,538.0 C380.1,530.0 380.1,554.0 344.1,552.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sxrogsm)"/><text x="388.1" y="540.0" font-size="12.5" fill="#333c45">cleanupsi → scopes[i].stop(true) → parent =</text><text x="388.1" y="555.0" font-size="12.5" fill="#333c45">undefined（effectScope.ts:141-162）</text><g><rect x="26.0" y="16" width="166.6" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="109.3" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">宿主组件（UIWidget）</text></g><g><rect x="232.6" y="16" width="222.8" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="344.1" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">EffectScope(detached=true)</text></g><g><rect x="495.5" y="16" width="133.1" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="562.0" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">ReactiveEffect</text></g></svg>