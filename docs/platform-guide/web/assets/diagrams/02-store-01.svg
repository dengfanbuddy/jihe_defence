te =</text><text x="256.3" y="389.1" font-size="13" fill="#2b3138">reactive(rawState)</text><text x="266.9" y="406.1" font-size="13" fill="#2b3138">Store.ts:147-151</text></g><rect x="190.6" y="465.0" width="261.6" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="210.6" y="487.1" font-size="13" fill="#2b3138">传了 persist 就 _loadPersisted +</text><text x="203.6" y="504.1" font-size="13" fill="#2b3138">_startPersist（当前无效，见 8-6）</text></g><rect x="188.6" y="563.0" width="265.6" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="201.6" y="585.1" font-size="13" fill="#2b3138">组装 composed：state 属性 + action</text><text x="278.9" y="602.1" font-size="13" fill="#2b3138">包装 + $ 工具</text><text x="228.4" y="619.1" font-size="13" fill="#2b3138">Store.ts:361-387 / 478-484</text></g><rect x="179.2" y="678.0" width="284.5" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="192.2" y="700.1" font-size="13" fill="#2b3138">composedProxy = proxyRefs(composed)</text><text x="238.4" y="717.1" font-size="13" fill="#2b3138">→ storeRegistry.set(id)</text><text x="264.1" y="734.1" font-size="13" fill="#2b3138">Store.ts:389-391</text></g><rect x="272.2" y="793.0" width="98.5" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="285.2" y="815.1" font-size="13" fill="#2b3138">组件读 / 写</text></g><rect x="322.6" y="243.5" width="285.9" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="335.6" y="265.6" font-size="13" fill="#2b3138">直接返回已有 $proxy：setup 不再执行，</text><text x="431.1" y="282.6" font-size="13" fill="#2b3138">同一份数据</text></g><rect x="42.9" y="874.0" width="274.2" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="55.9" y="896.1" font-size="13" fill="#2b3138">读：proxyRefs 自动解包（store.hp →</text><text x="91.9" y="913.1" font-size="13" fill="#2b3138">number，ref.ts:224-227）</text></g><rect x="347.1" y="874.0" width="253.0" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="360.1" y="896.1" font-size="13" fill="#2b3138">写：写回底层 ref（store.hp = 5 →</text><text x="368.1" y="913.1" font-size="13" fill="#2b3138">hp.value = 5，ref.ts:228-236）</text></g><rect x="22.0" y="972.0" width="279.0" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.0" y="994.1" font-size="13" fill="#2b3138">watch / scope.watch 回调（真响应式，</text><text x="57.9" y="1011.1" font-size="13" fill="#2b3138">HUD 靠它，View_Game_Stage.ts:</text><text x="127.6" y="1028.1" font-size="13" fill="#2b3138">263-286）</text></g><rect x="331.0" y="980.5" width="289.9" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="344.0" y="1002.6" font-size="13" fill="#2b3138">只有走 $patch 才额外通知 $subscribe（1</text><text x="410.1" y="1019.6" font-size="13" fill="#2b3138">60-167 → 217-223）</text></g></g><g class="edge-labels"><g><rect x="188.0" y="203.0" width="109.0" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="242.5" y="216.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;未命中（首次）&quot;</text></g><g><rect x="319.1" y="207.3" width="148.7" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="393.5" y="220.3" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">&quot;命中（第 2 次及以后）&quot;</text></g></g><g class="notes"></g></svg>