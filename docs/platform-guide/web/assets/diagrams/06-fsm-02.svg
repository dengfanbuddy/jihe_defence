<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 444" width="485" height="444" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-sdgg1d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><line x1="91.9" y1="46" x2="91.9" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="256.6" y1="46" x2="256.6" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="407.4" y1="46" x2="407.4" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="91.9" y1="62.0" x2="256.6" y2="62.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><rect x="128.0" y="41.0" width="92.5" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="174.2" y="54.0" font-size="12.5" fill="#333c45" text-anchor="middle">1. update(dt)</text><path d="M256.6,96.0 C292.6,88.0 292.6,112.0 256.6,110.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><text x="300.6" y="98.0" font-size="12.5" fill="#333c45">2. isEnabled 且 currentStateName 非空 ?</text><path d="M256.6,126.0 C292.6,118.0 292.6,142.0 256.6,140.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><text x="300.6" y="128.0" font-size="12.5" fill="#333c45">3. autoUpdateMap.get(current) == false ?</text><line x1="256.6" y1="152.0" x2="407.4" y2="152.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><rect x="246.3" y="131.0" width="171.4" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="332.0" y="144.0" font-size="12.5" fill="#333c45" text-anchor="middle">4. onUpdate(context, dt)</text><g><rect x="272.9" y="182.0" width="206.4" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M286.9,182.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="286.9" y="210.0" font-size="12" fill="#5c5433">状态的 onUpdate 里通常会调用</text><text x="286.9" y="226.0" font-size="12" fill="#5c5433">sm.changeState(...) 触发迁移</text></g><line x1="272.9" y1="195.0" x2="407.4" y2="195.0" stroke="#d9c98a" stroke-dasharray="4 3"/><line x1="407.4" y1="250.0" x2="256.6" y2="250.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><rect x="253.7" y="229.0" width="156.5" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="332.0" y="242.0" font-size="12.5" fill="#333c45" text-anchor="middle">5. changeState('Next')</text><line x1="256.6" y1="280.0" x2="407.4" y2="280.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><rect x="267.2" y="259.0" width="129.6" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="332.0" y="272.0" font-size="12.5" fill="#333c45" text-anchor="middle">6. onExit(context)</text><path d="M256.6,314.0 C292.6,306.0 292.6,330.0 256.6,328.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><text x="300.6" y="316.0" font-size="12.5" fill="#333c45">7. previous = current; current = 'Next'</text><path d="M256.6,344.0 C292.6,336.0 292.6,360.0 256.6,358.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><text x="300.6" y="346.0" font-size="12.5" fill="#333c45">8. 新状态.onEnter(context, ...)</text><path d="M256.6,374.0 C292.6,366.0 292.6,390.0 256.6,388.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)"/><text x="300.6" y="376.0" font-size="12.5" fill="#333c45">9. onStateChanged(previous, 'Next')</text><line x1="256.6" y1="400.0" x2="91.9" y2="400.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sdgg1d3)" stroke-dasharray="5 4"/><rect x="6.9" y="379.0" width="334.6" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="174.2" y="392.0" font-size="12.5" fill="#333c45" text-anchor="middle">10. 本次 update 结束（新状态要下一帧才 onUpdate）</text><g><rect x="26.0" y="16" width="131.8" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="91.9" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">组件.update(dt)</text></g><g><rect x="197.8" y="16" width="117.7" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="256.6" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">StateMachine</text></g><g><rect x="355.5" y="16" width="103.8" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="407.4" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">当前 IState</text></g></svg>