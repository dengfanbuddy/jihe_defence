3" marker-end="url(#a-fhc8r6h)"/><path d="M397.8117000000001,743 C397.8117000000001,766 397.8117000000001,766 397.8117000000001,789" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fhc8r6h)"/><path d="M397.8117000000001,789 C397.8117000000001,619 107.34500000000001,619 107.34500000000001,449" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fhc8r6h)"/><path d="M397.8117000000001,824 C397.8117000000001,847 397.8117000000001,847 397.8117000000001,870" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fhc8r6h)"/><path d="M397.8117000000001,870 C397.8117000000001,602 397.8117000000001,602 397.8117000000001,334" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fhc8r6h)"/><path d="M397.8117000000001,905 C397.8117000000001,928 397.8117000000001,928 397.8117000000001,951" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fhc8r6h)"/><path d="M397.8117000000001,334 C397.8117000000001,357 359.5033000000001,357 359.5033000000001,380" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fhc8r6h)" stroke-dasharray="5 4"/><path d="M397.8117000000001,334 C397.8117000000001,361.25 649.9700000000001,361.25 649.9700000000001,388.5" fill="none" stroke="#5b6470" stroke-width="1.3" marker-end="url(#a-fhc8r6h)" stroke-dasharray="5 4"/></g><g class="nodes"><rect x="273.3" y="22.0" width="249.0" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="286.3" y="44.1" font-size="13" fill="#2b3138">updateSecond() 由 TimeMgr 组件的</text><text x="338.4" y="61.1" font-size="13" fill="#2b3138">Schedule 每秒调用</text></g><rect x="293.2" y="120.0" width="209.3" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="306.2" y="142.1" font-size="13" fill="#2b3138">secondHandlers.size == 0 ?</text></g><rect x="168.9" y="201.0" width="201.1" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="181.9" y="223.1" font-size="13" fill="#2b3138">直接 return，一次都不遍历</text><text x="212.1" y="240.1" font-size="13" fill="#2b3138">TimeMgr.ts:53-55</text></g><rect x="400.1" y="201.0" width="226.6" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="413.1" y="223.1" font-size="13" fill="#2b3138">itr = secondHandlers.values()</text><text x="467.6" y="240.1" font-size="13" fill="#2b3138">TimeMgr.ts:56</text></g><rect x="287.0" y="299.0" width="221.7" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="300.0" y="321.1" font-size="13" fill="#2b3138">取下一个 list（Map 插入顺序）</text></g><rect x="22.0" y="397.0" width="170.7" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.0" y="419.1" font-size="13" fill="#2b3138">list.forEach(handler)</text><text x="61.5" y="436.1" font-size="13" fill="#2b3138">TimeMgr.ts:58</text></g><rect x="265.7" y="512.0" width="264.3" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="278.7" y="534.1" font-size="13" fill="#2b3138">try: handler.func.call(handler.obj)</text><text x="352.0" y="551.1" font-size="13" fill="#2b3138">TimeMgr.ts:60</text></g><rect x="336.2" y="708.0" width="123.3" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="349.2" y="730.1" font-size="13" fill="#2b3138">下一个 handler</text></g><rect x="296.1" y="610.0" width="203.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="309.1" y="632.1" font-size="13" fill="#2b3138">catch(e): console.error(e)</text><text x="341.9" y="649.1" font-size="13" fill="#2b3138">TimeMgr.ts:61-63</text></g><rect x="333.6" y="789.0" width="128.4" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="346.6" y="811.1" font-size="13" fill="#2b3138">本 list 遍历完 ?</text></g><rect x="329.1" y="870.0" width="137.3" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="342.1" y="892.1" font-size="13" fill="#2b3138">还有下一个 list ?</text></g><rect x="309.0" y="951.0" width="177.6" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="322.0" y="973.1" font-size="13" fill="#2b3138">本次遍历结束，等下一秒</text></g><rect x="222.7" y="380.0" width="273.6" height="86.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="245.0" y="402.1" font-size="13" fill="#2b3138">回调里 addSecHandler(同 id)：push</text><text x="286.3" y="419.1" font-size="13" fill="#2b3138">进正在 forEach 的数组</text><text x="235.7" y="436.1" font-size="13" fill="#2b3138">forEach 的长度已锁定 → 本次不调用，</text><text x="297.1" y="453.1" font-size="13" fill="#2b3138">下一秒才生效 [推断]</text></g><rect x="526.3" y="388.5" width="247.3" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="539.3" y="410.6" font-size="13" fill="#2b3138">回调里 removeSecHandler(同 id)：</text><text x="579.1" y="427.6" font-size="13" fill="#2b3138">splice 让后面元素前移</text><text x="560.4" y="444.6" font-size="13" fill="#2b3138">本次遍历可能漏掉一个处理器</text></g></g><g class="edge-labels"><g><rect x="322.6" y="169.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="333.7" y="182.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="444.5" y="169.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="455.6" y="182.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g><g><rect x="368.4" y="627.0" width="58.8" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="397.8" y="640.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">正常返回</text></g><g><rect x="380.6" y="578.0" width="34.4" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="397.8" y="591.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">抛错</text></g><g><rect x="241.5" y="610.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="252.6" y="623.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g><g><rect x="386.7" y="838.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="397.8" y="851.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="386.7" y="593.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="397.8" y="606.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">是</text></g><g><rect x="386.7" y="919.0" width="22.2" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="397.8" y="932.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">否</text></g></g><g class="notes"></g></svg>