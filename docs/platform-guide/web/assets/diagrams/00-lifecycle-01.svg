70" stroke-width="1.3" marker-end="url(#a-f7plw9b)"/></g><g class="nodes"><rect x="22.3" y="22.0" width="286.3" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.3" y="44.1" font-size="13" fill="#2b3138">node.active = true / setParent(激活父</text><text x="149.2" y="61.1" font-size="13" fill="#2b3138">节点)</text></g><rect x="36.2" y="120.0" width="258.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="49.2" y="142.1" font-size="13" fill="#2b3138">NodeActivator.activateNode(node,</text><text x="147.6" y="159.1" font-size="13" fill="#2b3138">true)</text></g><rect x="22.0" y="218.0" width="286.9" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.0" y="240.1" font-size="13" fill="#2b3138">_activateNodeRecursively：**只收集，</text><text x="137.0" y="257.1" font-size="13" fill="#2b3138">不执行**</text></g><rect x="23.2" y="316.0" width="284.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="36.2" y="338.1" font-size="13" fill="#2b3138">本节点的每个组件 → 分别登记进 preload</text><text x="53.7" y="355.1" font-size="13" fill="#2b3138">/ onLoad / onEnable 三个 invoker</text></g><rect x="22.6" y="414.0" width="285.8" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.6" y="436.1" font-size="13" fill="#2b3138">递归每个 active 的子节点（同样的顺序）</text></g><rect x="52.5" y="495.0" width="225.8" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="65.5" y="517.1" font-size="13" fill="#2b3138">task.preload.invoke()：全子树</text><text x="72.2" y="534.1" font-size="13" fill="#2b3138">__preload（前序：父 → 子）</text></g><rect x="54.9" y="593.0" width="221.0" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="67.9" y="615.1" font-size="13" fill="#2b3138">task.onLoad.invoke()：全子树</text><text x="82.3" y="632.1" font-size="13" fill="#2b3138">onLoad（前序：父 → 子）</text></g><rect x="48.7" y="691.0" width="233.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="61.7" y="713.1" font-size="13" fill="#2b3138">task.onEnable.invoke()：全子树</text><text x="76.1" y="730.1" font-size="13" fill="#2b3138">onEnable（前序：父 → 子）</text></g><rect x="22.6" y="789.0" width="285.6" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="35.6" y="811.1" font-size="13" fill="#2b3138">引擎发出 ACTIVE_IN_HIERARCHY_CHANGED</text><text x="151.6" y="828.1" font-size="13" fill="#2b3138">事件</text></g><rect x="28.0" y="887.0" width="274.9" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="41.0" y="909.1" font-size="13" fill="#2b3138">之后：每帧开头 startInvoker.invoke()</text><text x="118.2" y="926.1" font-size="13" fill="#2b3138">跑一次 start()</text><text x="41.7" y="943.1" font-size="13" fill="#2b3138">再跑 updatePhase / lateUpdatePhase</text></g></g><g class="edge-labels"></g><g class="notes"></g></svg>