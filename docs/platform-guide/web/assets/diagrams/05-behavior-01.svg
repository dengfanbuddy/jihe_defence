t x="611.4" y="287.1" font-size="13" fill="#2b3138">自己算一次：SUCCESS / FAILURE /</text><text x="694.7" y="304.1" font-size="13" fill="#2b3138">RUNNING</text></g><rect x="289.3" y="363.0" width="285.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="302.3" y="385.1" font-size="13" fill="#2b3138">某子返回 RUNNING：记下 currentIndex=i</text><text x="347.5" y="402.1" font-size="13" fill="#2b3138">，状态=RUNNING，立即返回</text></g><rect x="297.0" y="461.0" width="270.0" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="310.0" y="483.1" font-size="13" fill="#2b3138">本帧结束（update 不再往下做任何事）</text></g><rect x="347.3" y="542.0" width="169.4" height="35.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="360.3" y="564.1" font-size="13" fill="#2b3138">根状态是 RUNNING 吗？</text></g><rect x="142.6" y="623.0" width="287.8" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="155.6" y="645.1" font-size="13" fill="#2b3138">保留所有节点的内部状态；下一帧从那个记</text><text x="156.8" y="662.1" font-size="13" fill="#2b3138">下的下标 i 继续 tick —— 注意是重跑第 i</text><text x="204.1" y="679.1" font-size="13" fill="#2b3138">个孩子，不是跳到第 i+1 个</text></g><rect x="460.4" y="623.0" width="261.1" height="69.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="502.4" y="645.1" font-size="13" fill="#2b3138">update() 里 root.reset()：</text><text x="473.4" y="662.1" font-size="13" fill="#2b3138">每个节点状态写回 FAILURE，组合节点</text><text x="530.5" y="679.1" font-size="13" fill="#2b3138">currentIndex 归 0</text></g><rect x="289.8" y="738.0" width="284.5" height="52.0" rx="7" fill="#f3f7f4" stroke="#87a596" stroke-width="1.3"/><g><text x="302.8" y="760.1" font-size="13" fill="#2b3138">下一帧 update() 又从根的第一个孩子重新</text><text x="418.3" y="777.1" font-size="13" fill="#2b3138">开始</text></g></g><g class="edge-labels"><g><rect x="276.9" y="233.0" width="34.4" height="18" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="294.1" y=