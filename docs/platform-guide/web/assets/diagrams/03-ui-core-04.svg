<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1209 444" width="1209" height="444" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-stbbpvp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><line x1="139.4" y1="46" x2="139.4" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="340.1" y1="46" x2="340.1" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="539.4" y1="46" x2="539.4" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="803.4" y1="46" x2="803.4" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="1069.2" y1="46" x2="1069.2" y2="430" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="139.4" y1="62.0" x2="340.1" y2="62.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-stbbpvp)"/><rect x="143.0" y="41.0" width="193.6" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="239.8" y="54.0" font-size="12.5" fill="#333c45" text-anchor="middle">1. showUI(Scene_Game_Stage)</text><path d="M340.1,96.0 C376.1,88.0 376.1,112.0 340.1,110.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-stbbpvp)"/><text x="384.1" y="98.0" font-size="12.5" fill="#333c45">2. 注册表→层级→Scene 层清场（把 Scene_Menu</text><text x="384.1" y="113.0" font-size="12.5" fill="#333c45">closeView + 入缓存）→单例查栈→层节点子级→</text><text x="384.1" y="128.0" font-size="12.5" fill="#333c45">缓存，全部未命中</text><path d="M340.1,156.0 C376.1,148.0 376.1,172.0 340.1,170.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-stbbpvp)"/><text x="384.1" y="158.0" font-size="12.5" fill="#333c45">3. await loadUIPrefab('prefabs/ui/scenes/</text><text x="384.1" y="173.0" font-size="12.5" fill="#333c45">scene_game_stage/Scene_Game_Stage')</text><g><rect x="74.7" y="197.0" width="330.1" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M88.7,197.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="88.7" y="225.0" font-size="12" fill="#5c5433">这里是 await：showUI 返回未 resolve 的 Promise，</text><text x="88.7" y="241.0" font-size="12" fill="#5c5433">视图尚未入栈（坑 3 的成因）</text></g><path d="M340.1,269.0 C376.1,261.0 376.1,285.0 340.1,283.0" fill="none" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-stbbpvp)"/><text x="384.1" y="271.0" font-size="12.5" fill="#333c45">4. instantiate(prefab) → getComponent(Scene_Gam</text><text x="384.1" y="286.0" font-size="12.5" fill="#333c45">e_Stage) → uid = nextId()</text><line x1="340.1" y1="310.0" x2="539.4" y2="310.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-stbbpvp)"/><rect x="291.5" y="274.0" width="296.6" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="439.8" y="287.0" font-size="12.5" fill="#333c45" text-anchor="middle">5. stack.push + view.node.setParent(scenes</text><text x="439.8" y="302.0" font-size="12.5" fill="#333c45" text-anchor="middle">层节点) ← 激活点就在这一行</text><line x1="539.4" y1="355.0" x2="803.4" y2="355.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-stbbpvp)"/><rect x="504.0" y="319.0" width="334.8" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="671.4" y="332.0" font-size="12.5" fill="#333c45" text-anchor="middle">6. 阶段1 __preload（UIComponent.__preload：@bind</text><text x="671.4" y="347.0" font-size="12.5" fill="#333c45" text-anchor="middle">找节点 + @bindValue 建双向绑定）</text><line x1="539.4" y1="400.0" x2="1069.2" y2="400.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-stbbpvp)"/><rect x="741.1" y="379.0" width="126.5" height="17" rx="3" fill="#ffffff" opacity="0.93"/><text x="804.3" y="392.0" font-size="12.5" fill="#333c45" text-anchor="middle">7. 阶段1 __preload</text><g><rect x="26.0" y="16" width="226.8" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="139.4" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">调用方（Scene_Menu.enterGam</text><text x="139.4" y="52.0" font-size="13" fill="#26405a" text-anchor="middle">e）</text></g><g><rect x="292.8" y="16" width="94.6" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="340.1" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">UIManager</text></g><g><rect x="427.4" y="16" width="224.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="539.4" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">Cocos 激活（NodeActivator）</text></g><g><rect x="691.4" y="16" width="224.1" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="803.4" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">Scene_Game_Stage（BaseView</text><text x="803.4" y="52.0" font-size="13" fill="#26405a" text-anchor="middle">）</text></g><g><rect x="955.4" y="16" width="227.5" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="1069.2" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">子树 UIWidget（View_Game_Sta</text><text x="1069.2" y="52.0" font-size="13" fill="#26405a" text-anchor="middle">ge / 面板 / item）</text></g></svg>