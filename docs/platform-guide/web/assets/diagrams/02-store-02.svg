<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 811 481" width="811" height="481" role="img" aria-label="sequence diagram" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif"><defs><marker id="a-sa6gvr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs><rect x="490.1" y="280.0" width="308.4" height="85.0" rx="7" fill="rgba(238,243,249,0.45)" stroke="#b9c6d4" stroke-width="1.2"/><line x1="72.0" y1="46" x2="72.0" y2="467" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="220.7" y1="46" x2="220.7" y2="467" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="393.8" y1="46" x2="393.8" y2="467" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="550.1" y1="46" x2="550.1" y2="467" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="710.4" y1="46" x2="710.4" y2="467" stroke="#c8d1da" stroke-dasharray="4 4" stroke-width="1"/><line x1="72.0" y1="62.0" x2="220.7" y2="62.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa6gvr2)"/><rect x="-6.7" y="26.0" width="306.1" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="146.4" y="39.0" font-size="12.5" fill="#333c45" text-anchor="middle">store.addKillPoints(3) → _notifyAction(name,</text><text x="146.4" y="54.0" font-size="12.5" fill="#333c45" text-anchor="middle">args) Store.ts:373</text><line x1="220.7" y1="107.0" x2="393.8" y2="107.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa6gvr2)"/><rect x="148.0" y="56.0" width="318.6" height="47" rx="3" fill="#ffffff" opacity="0.93"/><text x="307.2" y="69.0" font-size="12.5" fill="#333c45" text-anchor="middle">同步调用 cb(call)，这一步就是 &quot;before&quot;；cb 里的</text><text x="307.2" y="84.0" font-size="12.5" fill="#333c45" text-anchor="middle">after()/onError() 只登记不执行（207-209 /</text><text x="307.2" y="99.0" font-size="12.5" fill="#333c45" text-anchor="middle">201-205）</text><line x1="220.7" y1="167.0" x2="550.1" y2="167.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa6gvr2)"/><rect x="226.9" y="131.0" width="317.1" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="385.4" y="144.0" font-size="12.5" fill="#333c45" text-anchor="middle">val.apply(composedProxy, args) 同步执行 action</text><text x="385.4" y="159.0" font-size="12.5" fill="#333c45" text-anchor="middle">体 Store.ts:375</text><g><rect x="423.4" y="212.0" width="381.1" height="50.0" rx="7" fill="#fffcf0" stroke="#d9c98a" stroke-width="1.2"/><path d="M437.4,212.0 l15,0 l-15,15 z" fill="#e8dcae"/><text x="437.4" y="240.0" font-size="12" fill="#5c5433">全程同步、无微任务；体内改 state 不触发 $subscribe（_no</text><text x="437.4" y="256.0" font-size="12" fill="#5c5433">tify 只在 166 / 175 / 464 被调用）</text></g><line x1="550.1" y1="314.0" x2="710.4" y2="314.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa6gvr2)"/><rect x="467.2" y="278.0" width="326.1" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="630.3" y="291.0" font-size="12.5" fill="#333c45" text-anchor="middle">$subscribe 回调 mutation={type:'patch'}（217-22</text><text x="630.3" y="306.0" font-size="12.5" fill="#333c45" text-anchor="middle">3，同步）</text><line x1="220.7" y1="377.0" x2="393.8" y2="377.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa6gvr2)"/><rect x="148.9" y="341.0" width="316.7" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="307.2" y="354.0" font-size="12.5" fill="#333c45" text-anchor="middle">正常返回 → after 回调（376）｜抛错 → onError</text><text x="307.2" y="369.0" font-size="12.5" fill="#333c45" text-anchor="middle">回调（379）后原样 rethrow（380）</text><line x1="220.7" y1="422.0" x2="72.0" y2="422.0" stroke="#4a5560" stroke-width="1.3" marker-end="url(#a-sa6gvr2)" stroke-dasharray="5 4"/><rect x="2.2" y="386.0" width="288.3" height="32" rx="3" fill="#ffffff" opacity="0.93"/><text x="146.4" y="399.0" font-size="12.5" fill="#333c45" text-anchor="middle">return result（抛错时 after</text><text x="146.4" y="414.0" font-size="12.5" fill="#333c45" text-anchor="middle">不执行；抛错前已改的 state 留在 store 里）</text><g><rect x="26.0" y="16" width="92.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="72.0" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">调用方</text></g><g><rect x="158.0" y="16" width="125.4" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="220.7" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">StoreInstance</text></g><g><rect x="323.4" y="16" width="140.7" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="393.8" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">$onAction 订阅者</text></g><g><rect x="504.1" y="16" width="92.0" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="550.1" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">action 体</text></g><g><rect x="636.1" y="16" width="148.4" height="30" rx="7" fill="#eef4fb" stroke="#8fb0cd" stroke-width="1.3"/><text x="710.4" y="36.0" font-size="13" fill="#26405a" text-anchor="middle">$subscribe 订阅者</text></g><g><path d="M490.1,300.0 h189.6 v-20 h-189.6 z" fill="#eef3f9" stroke="#b9c6d4" stroke-width="1.2"/><text x="498.1" y="294.5" font-size="11.5" fill="#41576e" font-family="ui-monospace,Consolas,monospace">opt action 体内调用了 $patch</text></g></svg>