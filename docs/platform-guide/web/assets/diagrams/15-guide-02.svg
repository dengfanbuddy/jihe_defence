="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">行）</text></g><g><rect x="-2.2" y="197.0" width="143.4" height="60" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="69.5" y="231.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">再次 initGuide（60-63</text><text x="69.5" y="244.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">行）；steps 与</text><text x="69.5" y="257.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">currentStep 被重置，</text><text x="69.5" y="270.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">但残留 once 与动画不清</text></g><g><rect x="-6.9" y="278.0" width="152.7" height="60" rx="4" fill="#f6f8f9" opacity="0.95"/><text x="69.5" y="312.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">node.active = false（96</text><text x="69.5" y="325.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">行）并落盘 localStorage</text><text x="69.5" y="338.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">键 guide_finished =</text><text x="69.5" y="351.0" font-size="11.5" fill="#4a5560" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">true（98 行）</text></g></g><g class="notes"></g></svg>