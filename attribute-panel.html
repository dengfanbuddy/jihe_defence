<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>属性面板 · SVG 图标 + PNG 导出</title>
<style>
  :root {
    --title: #2f6ea6;
    --header: #4c7fb3;
    --text: #22303f;
    --icon: #3a4a5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, system-ui, sans-serif;
    background: linear-gradient(160deg, #dbeafe 0%, #eef6ff 45%, #f7fbff 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    background: rgba(255,255,255,0.66);
    border: 1px solid rgba(130,170,210,0.4);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 26px rgba(70,110,150,0.14);
  }
  .toolbar .title { font-size: 14px; font-weight: 600; color: #33566f; }
  .toolbar label { font-size: 13px; color: #33566f; display: flex; align-items: center; gap: 6px; }
  .toolbar select, .toolbar button {
    font-family: inherit; font-size: 13px; border-radius: 8px; cursor: pointer;
  }
  .toolbar select {
    padding: 6px 8px; border: 1px solid rgba(130,170,210,0.5);
    background: #fff; color: #33566f;
  }
  .toolbar button {
    border: none; background: linear-gradient(135deg, #3f82c2, #2c6da3);
    color: #fff; padding: 8px 16px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(44,109,163,0.35);
    transition: transform .06s ease, box-shadow .15s ease;
  }
  .toolbar button:hover { box-shadow: 0 6px 16px rgba(44,109,163,0.45); }
  .toolbar button:active { transform: translateY(1px); }

  .stage { display: flex; justify-content: center; width: 100%; }
  #panel { display: block; max-height: 92vh; width: auto; }
  .hint { margin-top: 14px; font-size: 12px; color: #6b8ba6; }

  @media (max-width: 560px) {
    .toolbar { width: 100%; justify-content: center; }
    #panel { max-width: 100%; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="title">属性面板 · SVG 图标</span>
    <label>导出倍率
      <select id="scale">
        <option value="1">1x (600×1066)</option>
        <option value="2" selected>2x (1200×2132)</option>
        <option value="3">3x (1800×3198)</option>
        <option value="4">4x (2400×4264)</option>
      </select>
    </label>
    <button id="download">下载 PNG</button>
  </div>

  <div class="stage">
    <svg id="panel" xmlns="http://www.w3.org/2000/svg"
         width="600" height="1066" viewBox="0 0 600 1066"
         role="img" aria-label="属性面板"></svg>
  </div>

  <p class="hint">面板整体为一个内联 SVG，每个属性图标均为独立矢量路径；点击「下载 PNG」用 canvas 光栅化并导出。</p>

<script>
/* -------------------------------------------------------------
 * 图标库（24×24 视窗，全部使用 currentColor，便于统一着色）
 * ------------------------------------------------------------- */
const ICONS = {
  // 最大生命
  heart: `<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>`,
  // 最大魔法（药瓶）
  flask: `<path d="M10.5 3.5h3v2h-1c0 1 .1 1.8.4 2.5l3.5 5.8a4.6 4.6 0 0 1-4.1 6.7h-.6a4.6 4.6 0 0 1-4.1-6.7l3.5-5.8c.3-.7.4-1.5.4-2.5h-1v-2z"/><rect x="10" y="1.6" width="4" height="1.9" rx="0.7"/><path d="M7.8 12.5h8.4l1 1.7a3.2 3.2 0 0 1-2.9 4.8h-4.6a3.2 3.2 0 0 1-2.9-4.8l1-1.7z"/>`,
  // 攻击力 / 伤害输出（斜剑 + 护手）
  sword: `<path d="M21.4 2.6c.3 1.2-.1 2.5-1.1 3.5L8.2 18.2l-2.4-2.4L17.9 3.7c1-1 2.3-1.4 3.5-1.1z"/><path d="M6.6 13.4l1.5 1.5-4.4 6.2-1.7-1.7 4.6-6z"/><path d="M3 21.2l1.3-1.3c.6-.6 1.6-.6 2.2 0s.6 1.6 0 2.2l-1.3 1.3-2.2-2.2z"/>`,
  // 攻击速度（羽翼）
  wing: `<path d="M21.5 3.5C14 4 7.5 7.6 4 14l-1.5 3.5.9 1 2.9-2.9c.4-.8 1.2-1.3 2.1-1.2l1.9.2 2.7-2.7c.3-.3.4-.8.2-1.2l-.6-1.1c-.3-.5-.2-1.2.2-1.6l4-4c1.5-1 3.2-1.5 4.7-1.5z"/>`,
  // 移动速度（双重箭头）
  move: `<path d="M6 5.5l6.5 6.5L6 18.5l-1.6-1.6 4.9-4.9-4.9-4.9L6 5.5z"/><path d="M13.5 5.5l6.5 6.5-6.5 6.5-1.6-1.6 4.9-4.9-4.9-4.9 1.6-1.6z"/>`,
  // 护甲（盾牌）
  shield: `<path d="M12 2.5c2.4 1.5 5 2.3 8 2.6v5.8c0 5.2-3.2 9-8 11-4.8-2-8-5.8-8-11V5.1c3-.3 5.6-1.1 8-2.6z"/>`,
  // 魔法抗性（盾牌 + 星点）
  shield2: `<path d="M12 2.8c2.3 1.4 4.8 2.2 7.7 2.5v6c0 5-3.1 8.7-7.7 10.6-4.6-1.9-7.7-5.6-7.7-10.6v-6c2.9-.3 5.4-1.1 7.7-2.5z"/><path d="M12 7l1.1 2.4 2.4 1.1-2.4 1.1L12 14l-1.1-2.4-2.4-1.1 2.4-1.1L12 7z"/>`,
  // 闪避（奔跑的人）
  evade: `<circle cx="15.5" cy="4.5" r="2.1"/><path d="M14 8h3l1.6 4.6-1.2.5-1.2-3.1-.4 2.6 2.7 6-1.6 1-2.5-5.3-1.6 2.3 2.5 3-1.4 1.3-3.5-4.3-.5-2.9-3.2 3.4-1.5-1.2 4-4.4.7-2.7c.3-.9 1-1.5 1.9-1.7l2.2-.4z"/>`,
  // 生命恢复（旋转刷新）
  refresh: `<path d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.35 2.35z"/>`,
  // 魔法恢复（水滴）
  drop: `<path d="M12 2.8c3.4 4.1 6 7.3 6 11a6 6 0 0 1-12 0c0-3.7 2.6-6.9 6-11z"/><path d="M9.4 13.5a3 3 0 0 0 1.4 2.6c.4.2.8-.2.6-.6a2.2 2.2 0 0 1-.9-1.7c0-.4-.4-.7-.8-.6-.3 0-.4.2-.3.3z"/>`,
  // 物理受伤（盾 + 下箭头）
  phys: `<path d="M12 2.8c2.3 1.4 4.8 2.2 7.7 2.5v6c0 5-3.1 8.7-7.7 10.6-4.6-1.9-7.7-5.6-7.7-10.6v-6c2.9-.3 5.4-1.1 7.7-2.5z"/><path d="M12 7.2v6l-2.1-2.1-1.2 1.2 4 4 4-4-1.2-1.2-2.1 2.1v-6h-1.4z"/>`,
  // 魔法受伤（盾 + 星）
  magic: `<path d="M12 2.8c2.3 1.4 4.8 2.2 7.7 2.5v6c0 5-3.1 8.7-7.7 10.6-4.6-1.9-7.7-5.6-7.7-10.6v-6c2.9-.3 5.4-1.1 7.7-2.5z"/><path d="M12 7.4l1 2.3 2.3 1-2.3 1-1 2.3-1-2.3-2.3-1 2.3-1 1-2.3z"/>`,
  // 暴击率（五角星）
  crit1: `<path d="M12 2.5l2.4 5.6 6 .6-4.5 4.1 1.3 5.9L12 15.9l-5.2 2.8 1.3-5.9L3.6 8.7l6-.6L12 2.5z"/>`,
  // 暴击倍率（四芒星闪光）
  crit2: `<path d="M12 3c.6 3.6 1.5 6 3.5 8 2 2 4.5 2.9 8 3.5-3.5.6-6 1.5-8 3.5-2 2-2.9 4.5-3.5 8-.6-3.5-1.5-6-3.5-8-2-2-4.5-2.9-8-3.5 3.5-.6 6-1.5 8-3.5 2-2 2.9-4.5 3.5-8z" fill-rule="evenodd"/>`,
  // 攻击距离（准星）
  target: `<path d="M11 2h2v3.1a7 7 0 0 1 5.9 5.9H22v2h-3.1a7 7 0 0 1-5.9 5.9V22h-2v-3.1a7 7 0 0 1-5.9-5.9H2v-2h3.1A7 7 0 0 1 11 5.1V2z"/><circle cx="12" cy="12" r="2.4"/>`,
};

/* -------------------------------------------------------------
 * 数据（与截图一一对应）
 * ------------------------------------------------------------- */
const ROWS = [
  { icon: "heart",    label: "最大生命",   en: "MaxHp",            value: "300" },
  { icon: "flask",    label: "最大魔法",   en: "MaxMana",          value: "100" },
  { icon: "sword",    label: "攻击力",     en: "Atk",              value: "45" },
  { icon: "wing",     label: "攻击速度",   en: "AtkSpeed",         value: "1.2x" },
  { icon: "move",     label: "移动速度",   en: "MoveSpeed",        value: "120" },
  { icon: "shield",   label: "护甲",       en: "Def",              value: "15" },
  { icon: "shield2",  label: "魔法抗性",   en: "MagicResist",      value: "10%" },
  { icon: "evade",    label: "闪避",       en: "Evasion",          value: "5%" },
  { icon: "refresh",  label: "生命恢复",   en: "HpRegen",          value: "2/s" },
  { icon: "drop",     label: "魔法恢复",   en: "ManaRegen",        value: "1/s" },
  { icon: "sword",    label: "伤害输出",   en: "DamageOut",        value: "105%" },
  { icon: "phys",     label: "物理受伤",   en: "IncomingPhysical", value: "90%" },
  { icon: "magic",    label: "魔法受伤",   en: "IncomingMagical",  value: "85%" },
  { icon: "crit1",    label: "暴击率",     en: "CritRate",         value: "15%" },
  { icon: "crit2",    label: "暴击倍率",   en: "CritDmg",          value: "150%" },
  { icon: "target",   label: "攻击距离",   en: "AtkRange",         value: "200" },
];

const W = 600, H = 1066;

/* -------------------------------------------------------------
 * 构建面板 SVG
 * ------------------------------------------------------------- */
function iconMarkup({ name, x, y, size = 21 }) {
  // 采用字面量颜色而非 CSS 变量，保证“页面显示”与“序列化 SVG 导出的 PNG”完全一致
  const s = (size / 24).toFixed(3);
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="#3a4a5f">${ICONS[name]}</g>`;
}

function buildPanel() {
  const g = [];
  g.push(`<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f6"/>
      <stop offset=".5" stop-color="#eaf4fd"/>
      <stop offset="1" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#e9f3fc" stop-opacity=".72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7fa7cc" flood-opacity=".38"/>
    </filter>
  </defs>`);

  g.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#bg)"/>`);
  g.push(`<g filter="url(#shadow)"><rect x="70" y="130" width="460" height="810" rx="26" fill="url(#card)" stroke="#bcd6ed" stroke-width="1.2"/></g>`);

  g.push(`<text x="300" y="192" text-anchor="middle" font-size="27" font-weight="700" letter-spacing="6" fill="#2f6ea6" style="font-family:PingFang SC,Microsoft YaHei,sans-serif">属性面板</text>`);
  g.push(`<rect x="82" y="208" width="436" height="1.4" rx="0.7" fill="#bcd6ed" opacity=".8"/>`);

  g.push(`<text x="114" y="252" font-size="19" font-weight="600" letter-spacing="2" fill="#4c7fb3" style="font-family:PingFang SC,Microsoft YaHei,sans-serif">属性</text>`);
  g.push(`<text x="452" y="252" text-anchor="end" font-size="19" font-weight="600" letter-spacing="2" fill="#4c7fb3" style="font-family:PingFang SC,Microsoft YaHei,sans-serif">数值</text>`);

  const step = 37.5;
  const startY = 296;
  const iconX = 108;
  const labelX = 146;
  const valueX = 452;

  ROWS.forEach((r, i) => {
    const cy = startY + i * step;
    g.push(iconMarkup({ name: r.icon, x: iconX, y: cy - 10.5, size: 21 }));
    const label = `${r.label} (${r.en})`;
    g.push(`<text x="${labelX}" y="${cy + 6}" font-size="18" fill="#22303f" style="font-family:PingFang SC,Microsoft YaHei,sans-serif">${label}</text>`);
    g.push(`<text x="${valueX}" y="${cy + 6}" text-anchor="end" font-size="18" fill="#22303f" style="font-family:PingFang SC,Microsoft YaHei,sans-serif">${r.value}</text>`);
  });

  document.getElementById("panel").innerHTML = g.join("");
}

/* -------------------------------------------------------------
 * 导出 PNG
 * ------------------------------------------------------------- */
function svgToBlobUrl(svgEl) {
  const clone = svgEl.cloneNode(true);
  clone.setAttribute("width", W);
  clone.setAttribute("height", H);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const xml = new XMLSerializer().serializeToString(clone);
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

function downloadPng(scale) {
  const dataUrl = svgToBlobUrl(document.getElementById("panel"));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `attribute-panel-${W * scale}x${H * scale}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, "image/png");
  };
  img.src = dataUrl;
}

buildPanel();
document.getElementById("download").addEventListener("click", () => {
  downloadPng(parseInt(document.getElementById("scale").value, 10) || 2);
});
</script>
</body>
</html>
