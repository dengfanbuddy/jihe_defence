<h2>形态融合动画方案</h2>
<p class="subtitle">基于你的选择，初步方案如下：</p>

<div class="section">
  <h3>阶段一：循环加载 <span style="color:#888;font-weight:normal;font-size:0.8em">(loading)</span></h3>
  <div style="display:flex;gap:16px;align-items:center;margin:16px 0">
    <div style="background:#1a1a2e;border-radius:12px;padding:20px;width:200px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #333">
      <div style="width:120px;height:120px;border:2px solid #6cf;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative">
        <div style="position:absolute;width:100%;height:100%;border-radius:50%;clip-path:polygon(50% 0%,100% 0%,100% 100%,50% 100%,50% 50%);background:linear-gradient(135deg,#6cf,#f6c);transform:rotate(45deg)"></div>
        <span style="color:#fff;font-size:24px;font-weight:bold">72%</span>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <span style="width:16px;height:16px;background:#6cf;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);"></span>
        <span style="width:16px;height:16px;background:#c6f;border-radius:0;"></span>
        <span style="width:16px;height:16px;background:#f6c;border-radius:50%;"></span>
        <span style="width:16px;height:16px;background:#fc6;clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);"></span>
      </div>
    </div>
    <div style="flex:1">
      <ul style="color:#ccc;line-height:1.8">
        <li>几何图形循环变换：<strong>三角形 → 方形 → 圆形 → 六边形</strong></li>
        <li>图形持续旋转，每条边在变换时发光拖尾</li>
        <li>中心显示 <strong>百分比数字</strong> 表示加载进度</li>
        <li>外圈弧形进度环随 progress 值填充</li>
        <li>粒子沿特定轨迹飘散</li>
      </ul>
    </div>
  </div>
</div>

<div class="section">
  <h3>阶段二：完成转场 <span style="color:#888;font-weight:normal;font-size:0.8em">(complete)</span></h3>
  <div style="display:flex;gap:16px;align-items:center;margin:16px 0">
    <div style="background:#1a1a2e;border-radius:12px;padding:20px;width:200px;height:120px;display:flex;align-items:center;justify-content:center;border:1px solid #333;flex-direction:column">
      <div style="display:flex;gap:4px">
        <span style="width:8px;height:8px;background:#f6c;border-radius:50%;"></span>
        <span style="width:8px;height:8px;background:#6cf;border-radius:50%;"></span>
        <span style="width:8px;height:8px;background:#fc6;border-radius:50%;"></span>
        <span style="width:8px;height:8px;background:#c6f;border-radius:50%;"></span>
        <span style="width:8px;height:8px;background:#6fc;border-radius:50%;"></span>
      </div>
      <span style="color:#fff;font-size:14px;margin-top:8px">💥 图形爆炸消散 → 场景切入</span>
    </div>
    <div style="flex:1">
      <ul style="color:#ccc;line-height:1.8">
        <li>进度到达 100% 时触发</li>
        <li>中心图形向外爆炸碎裂成粒子</li>
        <li>全屏闪光遮罩瞬间闪过</li>
        <li>新场景完成切入</li>
      </ul>
    </div>
  </div>
</div>

<div class="section">
  <p class="subtitle">你觉得这个方案如何？需要调整任何细节吗？</p>
