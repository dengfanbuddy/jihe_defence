<h2>动画布局选择</h2>
<p class="subtitle">屏幕 750 × 1334，动画放在什么位置？</p>

<div class="options">
  <div class="option" data-choice="center" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>居中大圆 <span style="color:#888;font-weight:normal;font-size:0.85em">(推荐)</span></h3>
      <p>动画直径约 300px，屏幕正中央。上下有留白，符合视觉焦点</p>
      <div style="margin-top:12px;background:#1a1a2e;border-radius:8px;padding:12px;text-align:center;border:1px solid #333;width:160px;height:280px;margin-left:auto;margin-right:auto">
        <div style="color:#888;font-size:10px;text-align:left">▌750×1334</div>
        <div style="width:80px;height:80px;border:2px solid #67999A;border-radius:50%;margin:70px auto 0"></div>
        <div style="color:#EFEEED;font-size:16px;margin-top:8px;font-weight:bold">72%</div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="full" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>全屏覆盖</h3>
      <p>图形充满屏幕，showcase 式的大画面效果，加载时完全遮盖旧场景</p>
      <div style="margin-top:12px;background:#1a1a2e;border-radius:8px;padding:12px;text-align:center;border:1px solid #333;width:160px;height:280px;margin-left:auto;margin-right:auto">
        <div style="color:#888;font-size:10px;text-align:left">▌全屏</div>
        <div style="width:110px;height:110px;border:2px solid #67999A;border-radius:50%;margin:50px auto 0"></div>
        <div style="color:#67999A;font-size:14px;margin-top:4px">Loading...</div>
        <div style="color:#EFEEED;font-size:20px;margin-top:4px;font-weight:bold">72%</div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="bottom" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>底部紧凑</h3>
      <p>动画偏下，上方显示游戏名或 Logo，布局更丰富</p>
      <div style="margin-top:12px;background:#1a1a2e;border-radius:8px;padding:12px;text-align:center;border:1px solid #333;width:160px;height:280px;margin-left:auto;margin-right:auto">
        <div style="color:#888;font-size:10px;text-align:left">▌750×1334</div>
        <div style="color:#888;font-size:12px;padding-top:40px">游戏 Logo</div>
        <div style="width:60px;height:60px;border:2px solid #67999A;border-radius:50%;margin:30px auto 0"></div>
        <div style="color:#EFEEED;font-size:14px;margin-top:6px;font-weight:bold">72%</div>
      </div>
    </div>
  </div>
</div>

<p class="subtitle" style="margin-top:24px">选一个，或告诉我你的想法</p>
